[platformio]
default_envs = crowpanel_p4es
core_dir = .pio-core
; Lokale Anschlüsse dieses Rechners (upload_port, monitor_port), nicht versioniert.
extra_configs = platformio_lokal.ini

; Gemeinsame Einstellungen beider Kernvarianten. Welche gilt, entscheidet die P4-Chiprevision des Geräts, der Upload prüft sie vor dem Schreiben.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_crowpanel.csv
build_type = release
; Nur für LGFX-Sprites und VLW-Schriften, ohne Geräteerkennung. Das Bild gibt esp_lcd aus.
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/DIYLAB-DE/audio-lite.git#v0.2.0
; --wrap=esp_restart_noos leitet den letzten Schritt jedes Neustarts über src/SdmmcRestartReset.cpp, das den SDMMC-Host vor der übrigen Peripherie zurücksetzt.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wl,--wrap=esp_restart_noos
monitor_speed = 115200
upload_speed = 921600
; Geprüfter Upload über scripts/crowpanel_geraet.py: nur ein CH340, Chiprevision passend zur Kernvariante. Kein NVS, kein boot_app0, kein C6.
upload_protocol = custom
extra_scripts =
    pre:scripts/generate_html_header.py
    pre:scripts/fw_version.py
    post:scripts/crowpanel_upload.py

; ESP32-P4 Revision 0.x bis 1.x, Kernbibliotheken esp32p4_es, 360 MHz
[env:crowpanel_p4es]
board = crowpanel10-p4es

; ESP32-P4 ab Revision 3.0, Kernbibliotheken esp32p4, 400 MHz
[env:crowpanel_p4v3]
board = crowpanel10-p4
